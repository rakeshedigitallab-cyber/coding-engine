<div class="header-section">
    <div id="page-head" class="px-3 pt-4 pb-5">
        <div id="page-title">
            <h1 class="page-header text-overflow text-white">Billing</h1>
        </div>
        <ol class="breadcrumb">
            <li>
                <a [routerLink]="['/']" class="text-white-50">
                    <i class="fa-solid fa-house"></i>
                </a>
            </li>
            <li>
                <a href="javascript:void(0)" class="text-white-50">Code Engine</a>
            </li>
            <li class="active text-white">Billing</li>
        </ol>
    </div>
</div>

<div id="content-container" class="px-3">
    <div class="col-lg-12 main-card-container border rounded shadow-sm p-4 bg-white">
        <div class="card shadow-none border-0">
            <div class="card-body p-0">
                <h4 class="mb-5 fw-semibold text-dark-blue">ICDCode-10</h4>

                <!-- Nav Tabs -->
                <ul class="nav nav-tabs border-bottom mb-4" role="tablist">
                    <li class="nav-item" *ngFor="let label of tabLabels; let i = index" role="presentation">
                        <button class="nav-link" [class.active]="activeTab === i" [class.fw-bold]="activeTab === i"
                            (click)="setActiveTab(i)" type="button" role="tab">
                            {{ label }}
                        </button>
                    </li>
                </ul>

                <!-- Tab Content Section -->
                <div class="tab-content px-2">
                    <div class="tab-pane fade show active" *ngIf="activeTab === 0" role="tabpanel">
                        <app-icd-code10></app-icd-code10>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
